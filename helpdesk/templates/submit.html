{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card shadow">
            <div class="card-header">
                <h4 class="mb-0"><i class="bi bi-ticket-perforated"></i> Submit a Ticket</h4>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Your Name</label>
                            <input type="text" name="name" class="form-control" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" name="email" class="form-control" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Subject</label>
                        <input type="text" name="subject" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Description</label>
                        <textarea name="description" class="form-control" rows="6" required placeholder="Please describe the issue in detail..."></textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Priority</label>
                        <select name="priority" class="form-select">
                            <option value="Low">Low</option>
                            <option value="Medium" selected>Medium</option>
                            <option value="High">High</option>
                            <option value="Critical">Critical</option>
                        </select>
                    </div>
                    <div class="mb-4 form-check">
                        <input type="checkbox" name="remote" class="form-check-input" id="remote">
                        <label class="form-check-label" for="remote"><i class="bi bi-display"></i> Request Remote Support</label>
                        <div class="form-text">
                            Check this if you need remote help. For AnyDesk unattended access:<br>
                            Install AnyDesk → Settings → Security → Set password under <strong>Unattended Access</strong>, then share your AnyDesk ID + password with support.
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary btn-lg w-100">Submit Ticket</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
